name: Deploy Firebase Hosting (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: firebase-hosting-dev
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_DEV || 'https://poslevepoltronas-backend-dev-868489142786.southamerica-east1.run.app' }}
          VITE_TENANT_SLUG: ${{ vars.VITE_TENANT_SLUG || 'pos-leve' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POSLEVE }}
          projectId: posleve
          target: dev
          channelId: live
